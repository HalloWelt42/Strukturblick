# Dienste des Webshops vom Hofladen Lindenhof, gelesen von der Überwachung
version: 3
standard: &standard
  neustart: immer
  gesundheit: &gesundheit
    pfad: /gesund
    intervall: 30s
    versuche: 3

dienste:
  - name: katalog
    <<: *standard
    port: 8080
    pfad: /katalog
    gesundheit: *gesundheit
  - name: kasse
    <<: *standard
    port: 8081
    pfad: /kasse
    aktiv: true
    notiz: "Zahlung per Rechnung oder Lastschrift"
  - name: versand
    <<: *standard
    port: 8082
    pfad: /versand
    aktiv: false
    notiz: "Abholung im Hofladen, Versand ab Frühjahr"
