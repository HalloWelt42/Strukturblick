# Ausrollen auf den Pi mit tools/ausrollen.sh (Ablauf und Prüfungen im Appkern: appkern.werkzeuge.ausrollen).
# Rechner, Ordner, Adresse, Namen im Zertifikat und Leitstelle gehören dem Haus und stehen nicht im Repo:
# tools/ausrollen.sh holt sie aus der privaten Wahrheit (handbuch ziel strukturblick --toml) als Ergänzung.
kennung = "strukturblick"
repo = "https://github.com/HalloWelt42/Strukturblick.git"   # öffentlich: pi5b klont ohne Schlüssel
# ton: die App nutzt den Tondienst (Tonarbeit auf dem Mac über die Leitstelle); geprüft wird, ob die Leitstelle ihn meldet
ton = false
# Zugänge besorgt das Ausrollen (Appkern docs/ZUGAENGE.md): der App-Schlüssel der Kellerwolke für das Konto des Nutzers
# und der Zugang zur Leitstelle mit genau den Fähigkeiten, die das Werkzeug Mit KI braucht (STB-60).
[zugaenge]
name = "Strukturblick"
kellerwolke = "admin"
leitstelle = ["text"]
